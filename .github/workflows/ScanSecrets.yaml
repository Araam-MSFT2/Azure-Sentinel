name: Scanning for secrets in commits
on:
  pull_request:
    branches:
      - master
permissions:
  contents: read
  pull-requests: write
jobs:
  Scan_Secrets_in_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          extra_args: --exclude-paths=.script/SecretScanning/Excludepathlist --only-verified
